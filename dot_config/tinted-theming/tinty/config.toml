
[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-terminal"
themes-dir = "themes/ghostty"
hook = "mkdir -p ~/.config/ghostty/themes && cp -f %f ~/.config/ghostty/themes/tinted-theming"
supported-systems = ["base16", "base24"]

[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-wezterm"
themes-dir = "themes/wezterm"
hook = "mkdir -p ~/.config/wezterm/colors && cp -f %f ~/.config/wezterm/colors/tinted-theming"
supported-systems = ["base16", "base24"]

[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-shell"
themes-dir = "scripts"
hook = ". %f"

[[items]]
path = "https://github.com/tinted-theming/base16-vim"
name = "base16-vim"
themes-dir = "colors"

[[items]]
path = "https://github.com/tinted-theming/tinted-fzf"
name = "tinted-fzf"
hook = ". %f"
themes-dir = "sh"

[[items]]
path = "https://github.com/tinted-theming/tinted-tmux"
name = "tinted-tmux"
hook = "tmux source-file ~/.tmux.conf 2>/dev/null"
themes-dir = "colors"

[[items]]
path = "https://github.com/scaryrawr/base16-opencode"
name = "tinted-opencode"
hook = "mkdir -p ~/.config/opencode/themes && cp -f %f ~/.config/opencode/themes/tinted.json"
themes-dir = "themes"

[[items]]
path = "https://github.com/tinted-theming/base16-helix"
name = "base16-helix"
hook = "mkdir -p ~/.config/helix/themes && cp -f %f ~/.config/helix/themes/tinted.toml"
themes-dir = "themes"

# ttyd (web terminal) — reuse the Ghostty theme output, convert it to an
# xterm.js theme JSON and drop it at ~/.config/ttyd/theme.json. The ttyd
# LaunchDaemon watches that file and restarts itself to pick up the new colors.
[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-ttyd"
themes-dir = "themes/ghostty"
hook = "~/.config/ttyd/tinty-ttyd-theme.sh %f"
supported-systems = ["base16", "base24"]

# hunk (terminal diff viewer) — no official tinted repo exists. The hook reads
# the active palette from tinty's TINTY_SCHEME_* env vars and writes hunk's
# [custom_theme] config on the fly (hunk's diff-row fills need pre-blended
# colors — the script does the blending). We only borrow tinted-terminal's
# per-scheme files as a matcher so tinty fires the hook; %f itself is unused.
[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-hunk"
themes-dir = "themes/ghostty"
hook = "python3 ~/.config/hunk/tinty-hunk-theme.py"
supported-systems = ["base16", "base24"]

[[items]]
name = "tinted-claude-code"
path = "https://github.com/tinted-theming/tinted-claude-code"
themes-dir = "themes"
theme-file-extension = ".json"
supported-systems = ["base16", "base24", "tinted8"]
hook = "mkdir -p \"$HOME/.claude/themes\" && cp -f \"$TINTY_THEME_FILE_PATH\" \"$HOME/.claude/themes/tinty.json\""
